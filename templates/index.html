<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostTrack OSINT Web Console</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab-active {
      border-bottom: 2px solid #10b981;
      color: #10b981;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-gray-900/60 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-ghost text-emerald-400 text-2xl animate-pulse"></i>
        <h1 class="text-xl font-bold tracking-wider text-white">Ghost<span class="text-emerald-400">Track</span> Web</h1>
      </div>
      <div id="my-ip-badge" class="text-xs bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-full flex items-center space-x-2 text-gray-400">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
        <span>本机 IP: <span id="my-ip-val" class="text-emerald-400 font-mono">加载中...</span></span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
    
    <!-- Nav Tabs -->
    <div class="flex border-b border-gray-800 mb-8 space-x-8 text-sm font-medium">
      <button onclick="switchTab('ip')" id="tab-ip" class="tab-btn pb-3 px-1 flex items-center space-x-2 tab-active transition-colors">
        <i class="fa-solid fa-network-wired"></i>
        <span>IP 追踪 (IP Tracker)</span>
      </button>
      <button onclick="switchTab('phone')" id="tab-phone" class="tab-btn pb-3 px-1 flex items-center space-x-2 text-gray-400 hover:text-emerald-400 transition-colors">
        <i class="fa-solid fa-mobile-screen"></i>
        <span>号码溯源 (Phone Tracker)</span>
      </button>
      <button onclick="switchTab('username')" id="tab-username" class="tab-btn pb-3 px-1 flex items-center space-x-2 text-gray-400 hover:text-emerald-400 transition-colors">
        <i class="fa-solid fa-user-astronaut"></i>
        <span>社交用户名 (Username OSINT)</span>
      </button>
    </div>

    <!-- 1. IP Tracker Panel -->
    <section id="panel-ip" class="space-y-6">
      <div class="glass-card rounded-2xl p-6 shadow-xl">
        <h2 class="text-lg font-semibold text-white mb-2 flex items-center">
          <i class="fa-solid fa-crosshairs text-emerald-400 mr-2"></i> 目标 IP 查询
        </h2>
        <p class="text-xs text-gray-400 mb-4">查询 IP 的地理位置、经纬度、国家代码、ASN 及运营商等信息</p>
        
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="input-ip" placeholder="例如: 8.8.8.8 或 114.114.114.114"
            class="flex-1 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 font-mono">
          <button onclick="trackIp()" id="btn-ip"
            class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-semibold px-6 py-3 rounded-xl transition duration-150 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>开始查询</span>
          </button>
        </div>
      </div>

      <!-- IP Result Box -->
      <div id="result-ip" class="hidden glass-card rounded-2xl p-6 shadow-xl space-y-4">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
          <h3 class="text-md font-semibold text-white flex items-center">
            <i class="fa-solid fa-circle-info text-emerald-400 mr-2"></i> 查询结果
          </h3>
          <span id="ip-res-flag" class="text-2xl"></span>
        </div>
        <div id="ip-res-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-sm font-mono">
          <!-- 动态填充 -->
        </div>
      </div>
    </section>

    <!-- 2. Phone Tracker Panel -->
    <section id="panel-phone" class="hidden space-y-6">
      <div class="glass-card rounded-2xl p-6 shadow-xl">
        <h2 class="text-lg font-semibold text-white mb-2 flex items-center">
          <i class="fa-solid fa-phone-volume text-emerald-400 mr-2"></i> 电话号码识别
        </h2>
        <p class="text-xs text-gray-400 mb-4">输入目标手机号（带国家国际区号，如中国 +86，美国 +1）</p>
        
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="input-phone" placeholder="例如: +8613800138000 或 +12025550174"
            class="flex-1 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 font-mono">
          <button onclick="trackPhone()" id="btn-phone"
            class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-semibold px-6 py-3 rounded-xl transition duration-150 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>号码分析</span>
          </button>
        </div>
      </div>

      <!-- Phone Result Box -->
      <div id="result-phone" class="hidden glass-card rounded-2xl p-6 shadow-xl space-y-4">
        <div class="border-b border-gray-800 pb-3">
          <h3 class="text-md font-semibold text-white flex items-center">
            <i class="fa-solid fa-circle-check text-emerald-400 mr-2"></i> 号码解析数据
          </h3>
        </div>
        <div id="phone-res-content" class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm font-mono">
          <!-- 动态填充 -->
        </div>
      </div>
    </section>

    <!-- 3. Username Tracker Panel -->
    <section id="panel-username" class="hidden space-y-6">
      <div class="glass-card rounded-2xl p-6 shadow-xl">
        <h2 class="text-lg font-semibold text-white mb-2 flex items-center">
          <i class="fa-solid fa-id-badge text-emerald-400 mr-2"></i> 社交网络用户名探查 (OSINT)
        </h2>
        <p class="text-xs text-gray-400 mb-4">并发扫描 GitHub, Twitter, Instagram, TikTok, Telegram 等近 20 个主流平台</p>
        
        <div class="flex flex-col sm:flex-row gap-3">
          <input type="text" id="input-username" placeholder="输入目标用户名 (例如: torvalds)"
            class="flex-1 bg-gray-950 border border-gray-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 font-mono">
          <button onclick="trackUsername()" id="btn-username"
            class="bg-emerald-500 hover:bg-emerald-600 text-gray-950 font-semibold px-6 py-3 rounded-xl transition duration-150 flex items-center justify-center space-x-2">
            <i class="fa-solid fa-radar"></i>
            <span>全网扫描</span>
          </button>
        </div>
      </div>

      <!-- Username Result Box -->
      <div id="result-username" class="hidden glass-card rounded-2xl p-6 shadow-xl space-y-4">
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
          <h3 class="text-md font-semibold text-white flex items-center">
            <i class="fa-solid fa-chart-pie text-emerald-400 mr-2"></i> 扫描结果列表
          </h3>
          <span id="scan-stat" class="text-xs text-gray-400"></span>
        </div>
        <div id="username-res-content" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-sm">
          <!-- 动态填充 -->
        </div>
      </div>
    </section>

  </main>

  <footer class="border-t border-gray-800 text-center py-4 text-xs text-gray-500">
    GhostTrack Web UI · Built with Flask & TailwindCSS
  </footer>

  <!-- 页面交互脚本 -->
  <script>
    // Tab 切换逻辑
    function switchTab(tab) {
      ['ip', 'phone', 'username'].forEach(t => {
        document.getElementById(`tab-${t}`).className = 'tab-btn pb-3 px-1 flex items-center space-x-2 text-gray-400 hover:text-emerald-400 transition-colors';
        document.getElementById(`panel-${t}`).classList.add('hidden');
      });
      document.getElementById(`tab-${tab}`).className = 'tab-btn pb-3 px-1 flex items-center space-x-2 tab-active transition-colors';
      document.getElementById(`panel-${tab}`).classList.remove('hidden');
    }

    // 页面载入时自动获取本机 IP
    fetch('/api/my-ip')
      .then(r => r.json())
      .then(d => {
        if (d.ip) {
          document.getElementById('my-ip-val').innerText = d.ip;
          document.getElementById('input-ip').value = d.ip;
        }
      })
      .catch(() => {
        document.getElementById('my-ip-val').innerText = '获取失败';
      });

    // 辅助渲染条目
    function renderItem(label, value, isLink = false) {
      let content = `<span class="text-gray-300 font-bold">${value || '—'}</span>`;
      if (isLink && value) {
        content = `<a href="${value}" target="_blank" class="text-emerald-400 underline hover:text-emerald-300 break-all">点击打开</a>`;
      }
      return `
        <div class="bg-gray-900/80 p-3 rounded-lg border border-gray-800/80 flex flex-col justify-between">
          <span class="text-xs text-gray-400 mb-1">${label}</span>
          ${content}
        </div>
      `;
    }

    // 1. IP Tracker
    async function trackIp() {
      const ip = document.getElementById('input-ip').value.trim();
      if (!ip) return alert('请输入目标 IP 地址');
      const btn = document.getElementById('btn-ip');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>查询中...</span>';

      try {
        const res = await fetch('/api/track-ip', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ ip })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const box = document.getElementById('result-ip');
        box.classList.remove('hidden');

        document.getElementById('ip-res-flag').innerText = data.flag?.emoji || '';
        const mapUrl = (data.latitude && data.longitude) ? `https://www.google.com/maps/@${data.latitude},${data.longitude},10z` : null;

        const html = `
          ${renderItem('IP 地址', data.ip)}
          ${renderItem('国家 / 地区', `${data.country} (${data.country_code})`)}
          ${renderItem('城市 / 区域', `${data.region} · ${data.city}`)}
          ${renderItem('运营商 / ISP', data.connection?.isp)}
          ${renderItem('ASN', data.connection?.asn)}
          ${renderItem('组织 / Org', data.connection?.org)}
          ${renderItem('时区', `${data.timezone?.id} (UTC ${data.timezone?.utc})`)}
          ${renderItem('当前时间', data.timezone?.current_time)}
          ${renderItem('邮编 (Postal)', data.postal)}
          ${renderItem('经纬度', `${data.latitude}, ${data.longitude}`)}
          ${renderItem('Google 地图', mapUrl, true)}
        `;
        document.getElementById('ip-res-content').innerHTML = html;
      } catch (err) {
        alert('查询出错: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i><span>开始查询</span>';
      }
    }

    // 2. Phone Tracker
    async function trackPhone() {
      const phone = document.getElementById('input-phone').value.trim();
      if (!phone) return alert('请输入电话号码');
      const btn = document.getElementById('btn-phone');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>分析中...</span>';

      try {
        const res = await fetch('/api/track-phone', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ phone })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const box = document.getElementById('result-phone');
        box.classList.remove('hidden');

        const html = `
          ${renderItem('归属地 / 地理位置', data.location)}
          ${renderItem('国家地区代码', data.region_code)}
          ${renderItem('电信运营商', data.carrier)}
          ${renderItem('号码类型', data.type)}
          ${renderItem('有效号码', data.valid ? '<span class="text-emerald-400">是 (Valid)</span>' : '<span class="text-rose-500">否</span>')}
          ${renderItem('国际格式', data.international_format)}
          ${renderItem('E.164 规范格式', data.e164_format)}
          ${renderItem('时区', data.timezone)}
        `;
        document.getElementById('phone-res-content').innerHTML = html;
      } catch (err) {
        alert('解析出错: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-magnifying-glass"></i><span>号码分析</span>';
      }
    }

    // 3. Username Tracker
    async function trackUsername() {
      const username = document.getElementById('input-username').value.trim();
      if (!username) return alert('请输入用户名');
      const btn = document.getElementById('btn-username');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>全网扫描中...</span>';

      try {
        const res = await fetch('/api/track-username', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const box = document.getElementById('result-username');
        box.classList.remove('hidden');

        const foundCount = data.results.filter(r => r.status === 'Found').length;
        document.getElementById('scan-stat').innerText = `已完成扫描 ${data.results.length} 个站点 · 命中 ${foundCount} 个账号`;

        let html = '';
        data.results.forEach(site => {
          const isFound = site.status === 'Found';
          html += `
            <div class="p-3 rounded-lg border ${isFound ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-gray-800 bg-gray-900/40'} flex items-center justify-between">
              <div class="truncate mr-2">
                <div class="font-semibold text-white">${site.name}</div>
                <div class="text-xs text-gray-500 truncate">${site.url}</div>
              </div>
              <div>
                ${isFound ? 
                  `<a href="${site.url}" target="_blank" class="text-xs px-2.5 py-1 bg-emerald-500/20 text-emerald-400 rounded-md border border-emerald-500/40 hover:bg-emerald-500/30">访问</a>` : 
                  `<span class="text-xs text-gray-500">未找到</span>`
                }
              </div>
            </div>
          `;
        });
        document.getElementById('username-res-content').innerHTML = html;
      } catch (err) {
        alert('扫描出错: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-radar"></i><span>全网扫描</span>';
      }
    }
  </script>
</body>
</html>
